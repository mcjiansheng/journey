log_format journey_safe '$time_iso8601 $request_method $status $request_time $upstream_http_x_request_id';

server {
    listen 443 ssl;
    server_name journey.jscloud.wang;
    ssl_certificate /etc/nginx/journey-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/journey-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/journey.access.log journey_safe;
    error_log /var/log/nginx/journey.error.log;

    location / {
        proxy_pass http://127.0.0.1:4177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
