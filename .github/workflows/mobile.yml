name: Native clients

on:
  push:
    branches: [dev, main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Unit tests, lint and APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select an installed iPhone simulator
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for rows in d["devices"].values() for v in rows if v["name"].startswith("iPhone")))')
          echo "JOURNEY_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build and test SwiftUI client
        run: >-
          xcodebuild test
          -project mobile/ios/Journey.xcodeproj
          -scheme Journey
          -destination "platform=iOS Simulator,id=$JOURNEY_SIMULATOR"
          -only-testing:JourneyTests
          -derivedDataPath .local/ios
          CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: ditto -c -k --keepParent .local/ios/Build/Products/Debug-iphonesimulator/Journey.app .local/Journey-iOS-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-ios-simulator
          path: .local/Journey-iOS-simulator.zip
          include-hidden-files: true
          if-no-files-found: error
